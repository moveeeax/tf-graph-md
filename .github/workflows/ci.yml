name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Smoke-test CLI
        run: |
          tf-graph-md --version
          out=$(tf-graph-md --input examples/graph.dot --group-modules)
          echo "$out"
          echo "$out" | grep -q '^graph LR'
          echo "$out" | grep -q 'subgraph module_vpc'
          echo "$out" | grep -q 'aws_instance.web'
          test "$(echo "$out" | grep -c -- '-->')" -eq 2
